# Use case test U0: does the first design's Databricks sign-in still work?
#
# The first design (docs/USE_CASE.md, section 2) has the Databricks provider
# impersonate a Google service account and sign in with a Google ID token.
# Own-IdP SSO turns that off for the whole account, so with SSO on the plan
# is expected to fail on its first account call. The job records what
# happened and passes either way: the result is the evidence.
#
# Needs bootstrap/ applied with first_design_test = true (the apply identity as
# a Databricks account admin, and token creator on itself). Run by hand on main.

name: first-design

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_google_service_account_email: ${{ vars.GCP_APPLY_SA }}
      TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: first-design
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Application default credentials for the provider: the apply identity,
      # through workload identity federation. The provider then mints a Google
      # ID token as that account.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: plan
        run: |
          terraform init -input=false -no-color
          set +e
          terraform plan -input=false -no-color -lock=false > plan.log 2>&1
          rc=$?
          set -e
          cat plan.log
          {
            echo "### first-design: provider with google_service_account"
            echo "- $(terraform version | head -1); databricks provider $(terraform version -json | jq -r '.provider_selections["registry.terraform.io/databricks/databricks"]')"
            if [ "$rc" -eq 0 ]; then
              echo "- plan: **succeeded**: the account accepted the Google ID token"
            else
              echo "- plan: **refused** (exit code $rc)"
            fi
            echo '```'
            grep -E "Error|error|401|Invalid|workspace_count" plan.log | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
